<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark" />
        <title>Math Parser</title>

        <script src="scripts/main.js"></script>

        <link rel="stylesheet" type="text/css" href="styles/main.css" />
    </head>

    <body>
        <div class="terminal">
            <div id="display">

            </div>
            <div class="prompt">
                <span class="chevron">&gt;</span>
                <input id="query" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="expression" />
            </div>
        </div>
    </body>
</html>
